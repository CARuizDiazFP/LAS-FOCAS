# Nombre de archivo: pytest.ini
# Ubicación de archivo: pytest.ini
# Descripción: Configuración de Pytest para LAS-FOCAS

[pytest]
testpaths =
    tests
    nlp_intent/tests
norecursedirs = Legacy
pythonpath =
    .
markers =
    slow: tests lentos (deseleccionar con -m "not slow")
    office_real: conversión contra un office_service real (bajo demanda, requiere OFFICE_REAL_URL)
# Ruido de terceros: matplotlib llama a la API camelCase deprecada de pyparsing (no es código del proyecto).
filterwarnings =
    ignore::DeprecationWarning:matplotlib\..*
