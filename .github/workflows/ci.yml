# Nombre de archivo: ci.yml
# Ubicación de archivo: .github/workflows/ci.yml
# Descripción: CI con tests y verificación de seguridad (pip-audit)

name: CI

on:
  workflow_dispatch:

jobs:
  skills-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check skills mirror drift
        run: |
          bash scripts/check_skill_mirror_drift.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r common-requirements.txt -r api/requirements.txt -r web/requirements.txt -r requirements-dev.txt -r modules/cromo_worker/requirements.txt
      - name: Bootstrap local secrets
        run: |
          ./scripts/setup_local_secrets.sh --ci
      - name: Check no plaintext secrets
        run: |
          ./scripts/check_no_plaintext_secrets.sh
      # Un solo paso: `testpaths` de pytest.ini ya incluye tests/ y nlp_intent/tests. Antes había
      # pasos separados para API/NLP/Web que repetían los mismos archivos dentro del paso general.
      - name: Run pytest
        env:
          LLM_PROVIDER: heuristic
          TESTING: "true"
        run: |
          pytest -q

  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install -r requirements-dev.txt
      # Se audita lo que instalan las imágenes (ver la cabecera de cada requirements): focas-base se
      # construye con common-requirements.txt, y cada Dockerfile hijo suma su requirements propio.
      # requirements.txt (raíz) sólo alimenta el venv local, pero también se audita.
      - name: Audit common requirements (focas-base)
        run: pip-audit -r common-requirements.txt
      - name: Audit root requirements (venv local)
        run: pip-audit -r requirements.txt
      - name: Audit api requirements
        run: pip-audit -r api/requirements.txt
      - name: Audit web requirements
        run: pip-audit -r web/requirements.txt
      - name: Audit bot_telegram requirements
        run: pip-audit -r bot_telegram/requirements.txt
      - name: Audit office_service requirements
        run: pip-audit -r office_service/requirements.txt
      - name: Audit workers requirements
        run: |
          rc=0
          for req in modules/*/requirements.txt; do
            echo "::group::$req"
            pip-audit -r "$req" || rc=1
            echo "::endgroup::"
          done
          exit $rc

  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package.json
      - name: Install Node deps
        working-directory: web/frontend
        run: |
          npm ci || npm i
      - name: Run npm audit (informativo)
        working-directory: web/frontend
        run: |
          npm audit --audit-level=high || true
