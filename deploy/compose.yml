# Nombre de archivo: compose.yml
# Ubicación de archivo: deploy/compose.yml
# Descripción: Stack base con PostgreSQL + API FastAPI + healthchecks y volumen persistente
 

name: lasfocas

services:
  postgres:
    image: postgres:16-alpine
    container_name: lasfocas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password_v1
    secrets:
      - db_password_v1
    expose:
      - "5432"
    ports:
      - "127.0.0.1:5432:5432"  # Solo localhost para MCP/desarrollo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lasfocas_net

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: lasfocas-api
    restart: unless-stopped
    user: "1001:1001"
    env_file:
      - ../.env
    environment:
      # Aseguramos que el host de DB sea el nombre del servicio de compose
      POSTGRES_HOST: postgres
    secrets:
      - api_key_v1
      - db_password_v1
      - smtp_password_v1
      - slack_bot_token_v1
      - slack_app_token_v1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000" # 8000 ocupado por otro servicio externo a este stack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || curl -fsS http://172.18.208.162:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - lasfocas_net

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: lasfocas-docker-socket-proxy
    restart: unless-stopped
    environment:
      # Acota la API de Docker a lo mínimo que necesita web/app/main.py:
      # containers.get() + container.start() + container.reload() sobre un único
      # contenedor (slack_baneo_worker). Nada de create/exec/remove/images/volumes/redes.
      CONTAINERS: 1
      ALLOW_START: 1
      POST: 0
      AUTH: 0
      SECRETS: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      BUILD: 0
      SWARM: 0
      SYSTEM: 0
      INFO: 0
      SERVICES: 0
      NODES: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp
    expose:
      - "2375"
    networks:
      - docker_proxy_net

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: lasfocas-web
    user: "1001:1001"
    env_file:
      - ../.env
    environment:
      NLP_INTENT_URL: http://nlp_intent:8100
      API_BASE: http://172.18.208.162:8080
      LOGS_DIR: /app/Logs
      REPORTS_DIR: /app/data/reports
      UPLOADS_DIR: /app/data/uploads
      TEMPLATES_DIR: /app/Templates
      WEB_CHAT_ALLOWED_ORIGINS: ${WEB_CHAT_ALLOWED_ORIGINS:-}
      OFFICE_SERVICE_BASE: http://office:8090
      # Gestión del worker de baneos desde el panel admin vía proxy acotado (ver docker-socket-proxy),
      # sin montar /var/run/docker.sock directamente en este contenedor.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # LOG_LEVEL se toma de .env; si se desea sobreescribir aquí se puede definir.
    secrets:
      - api_key_v1
      - db_password_v1
      - web_secret_key_v1
      - smtp_password_v1
      - slack_bot_token_v1
      - slack_app_token_v1
    depends_on:
      - api
      - nlp_intent
      - postgres
      - docker-socket-proxy
    ports:
      - "172.18.208.162:8080:8080"
    volumes:
      - ../Logs:/app/Logs
      - ../Templates:/app/Templates:ro
      - reports_data:/app/data/reports
      - uploads_data:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || curl -fsS http://172.18.208.162:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - lasfocas_net
      - docker_proxy_net

  nlp_intent:
    build:
      context: ..
      dockerfile: deploy/docker/nlp_intent.Dockerfile
    env_file:
      - ../.env
    secrets:
      - openai_api_key_v1
    expose:
      - "8100"
    restart: unless-stopped
    networks:
      - lasfocas_net
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\ntry:\n  with urllib.request.urlopen('http://localhost:8100/health', timeout=5) as r:\n    exit(0 if r.status==200 else 1)\nexcept Exception:\n  exit(1)\nPY"]
      interval: 10s
      timeout: 5s
      retries: 12

  bot:
    build:
      context: ..
      dockerfile: deploy/docker/bot.Dockerfile
    user: "1001:1001"
    env_file:
      - ../.env
    secrets:
      - db_password_v1
      - telegram_bot_token_v1
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - bot_data:/app/data

  office:
    build:
      context: ../office_service
      dockerfile: Dockerfile
    container_name: lasfocas-office
    env_file:
      - ../.env
    environment:
      OFFICE_ENABLE_UNO: ${OFFICE_ENABLE_UNO:-true}
      OFFICE_LOG_LEVEL: ${OFFICE_LOG_LEVEL:-INFO}
    expose:
      - "8090"
      - "2002"
    restart: unless-stopped
    networks:
      - lasfocas_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  repetitividad_worker:
    build:
      context: ..
      dockerfile: deploy/docker/repetitividad_worker.Dockerfile
    profiles: ["reports-worker"]
    user: "1001:1001"
    env_file:
      - ../.env
    environment:
      TEMPLATES_DIR: /app/Templates
    volumes:
      - ../Templates:/app/Templates:ro
      - ../Reports:/app/data/reports
    command: ["python", "-m", "modules.informes_repetitividad.worker"]

  slack_baneo_worker:
    build:
      context: ..
      dockerfile: deploy/docker/slack_baneo_worker.Dockerfile
    container_name: lasfocas-slack-baneo-worker
    user: "1001:1001"
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      LOGS_DIR: /app/Logs
      TZ: America/Argentina/Buenos_Aires
      APP_TIMEZONE: America/Argentina/Buenos_Aires
    secrets:
      - db_password_v1
      - slack_bot_token_v1
      - slack_app_token_v1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8095"
    volumes:
      - ../Logs:/app/Logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8095/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lasfocas_net

  # (Opcional) pgAdmin. Levantar con: docker compose -f deploy/compose.yml --profile pgadmin up -d
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: lasfocas-pgadmin
    profiles: ["pgadmin"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password_v1
    secrets:
      - pgadmin_password_v1
    # pgAdmin corre como uid 5050 (no root, no coincide con el dueño del secreto en el
    # host). Compose sin Swarm monta los secretos como bind mount preservando los
    # permisos del host tal cual (ignora uid/gid/mode de la sintaxis larga), así que
    # necesita leer el archivo por grupo: el secreto queda en 640 + group support-focal-01,
    # y acá se agrega ese grupo como suplementario al contenedor.
    group_add:
      - "1001"
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres
    networks:
      - lasfocas_net

volumes:
  postgres_data:
  bot_data:
  reports_data:
  uploads_data:

networks:
  lasfocas_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
  # Red dedicada web <-> docker-socket-proxy: ningún otro servicio de lasfocas_net
  # (api, postgres, nlp_intent, office, pgadmin) puede alcanzar el proxy aunque se comprometa.
  docker_proxy_net:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1

secrets:
  api_key_v1:
    file: ../.secrets/api_key_v1.txt
  db_password_v1:
    file: ../.secrets/db_password_v1.txt
  web_secret_key_v1:
    file: ../.secrets/web_secret_key_v1.txt
  telegram_bot_token_v1:
    file: ../.secrets/telegram_bot_token_v1.txt
  openai_api_key_v1:
    file: ../.secrets/openai_api_key_v1.txt
  smtp_password_v1:
    file: ../.secrets/smtp_password_v1.txt
  slack_bot_token_v1:
    file: ../.secrets/slack_bot_token_v1.txt
  slack_app_token_v1:
    file: ../.secrets/slack_app_token_v1.txt
  pgadmin_password_v1:
    file: ../.secrets/pgadmin_password_v1.txt
